<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1e9">
    <meta name="description" content="リズム — three Japanese characters moving in an endless three-dimensional rhythm.">
    <title>リズム · Rhythm</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header><a class="wordmark" href="./" aria-label="Rhythm home">RIZUMU<span>®</span></a><span class="edition">A STUDY IN MOTION / 001</span></header>
    <main>
      <div class="scene" role="img" aria-label="リズム, the Japanese word for rhythm, spinning around a three-dimensional ellipse">
        <div class="orbit" aria-hidden="true"></div>
        <div class="center" aria-hidden="true"><span class="dot"></span><span>リズム</span></div>
        <div class="character" data-character="リ" aria-hidden="true"></div>
        <div class="character" data-character="ズ" aria-hidden="true"></div>
        <div class="character" data-character="ム" aria-hidden="true"></div>
      </div>
      <div class="caption"><span lang="ja">リズム</span><span>RHYTHM, IN AN ENDLESS LOOP.</span></div>
    </main>
    <footer><span>THREE CHARACTERS. ONE ORBIT.</span><button id="motion" type="button" aria-pressed="false"><span class="button-icon" aria-hidden="true">Ⅱ</span><span class="button-label">PAUSE MOTION</span></button><span class="footer-right">HTML / CSS / JS</span></footer>
  </body>
</html>
